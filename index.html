<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess Analyzer</title>

<!-- Google Fonts: Inter -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Chessboard CSS -->
<link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- Chessboard JS (UI) & Chess JS (Logic) -->
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>
/* ============================================================
   Design tokens
   ============================================================ */
:root{
    color-scheme: light;

    --bg:            #eef1f7;
    --glow-1:        rgba(37, 99, 235, .20);
    --glow-2:        rgba(124, 58, 237, .18);

    --surface:       #ffffff;
    --surface-2:     #f6f8fc;
    --surface-3:     #eef2f8;

    --text:          #101828;
    --muted:         #667085;

    --border:        #e4e7ec;
    --border-strong: #cfd6e0;

    --accent:        #2563eb;
    --accent-hover:  #1d4ed8;
    --accent-soft:   rgba(37, 99, 235, .14);

    --danger-fg:     #b42318;
    --danger-soft:   rgba(220, 53, 69, .12);
    --success-fg:    #146c2e;
    --success-soft:  #e7f6ec;
    --warn-fg:       #8a6100;
    --warn-soft:     #fdf3d7;

    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;

    --shadow-card: 0 1px 2px rgba(16,24,40,.04), 0 18px 40px -24px rgba(16,24,40,.45);
    --shadow-pop:  0 12px 26px -12px rgba(16,24,40,.45);
}

@media (prefers-color-scheme: dark){
    :root{
        color-scheme: dark;

        --bg:            #0a0e17;
        --glow-1:        rgba(37, 99, 235, .25);
        --glow-2:        rgba(124, 58, 237, .22);

        --surface:       #131a28;
        --surface-2:     #1a2334;
        --surface-3:     #212c42;

        --text:          #e8edf7;
        --muted:         #93a0b8;

        --border:        #243044;
        --border-strong: #33415a;

        --accent:        #5b8dff;
        --accent-hover:  #7aa2ff;
        --accent-soft:   rgba(91, 141, 255, .18);

        --danger-fg:     #ff9aa6;
        --danger-soft:   rgba(255, 99, 122, .14);
        --success-fg:    #6ee7a0;
        --success-soft:  rgba(34, 197, 94, .14);
        --warn-fg:       #fbbf24;
        --warn-soft:     rgba(250, 204, 21, .14);

        --shadow-card: 0 1px 2px rgba(0,0,0,.5), 0 18px 40px -24px rgba(0,0,0,.9);
        --shadow-pop:  0 12px 26px -12px rgba(0,0,0,.85);
    }
}

/* ============================================================
   Base
   ============================================================ */
*, *::before, *::after{ box-sizing: border-box; }
html, body{ margin: 0; padding: 0; }

body{
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--text);
    background-color: var(--bg);
    background-image:
        radial-gradient(1100px 600px at 8% -12%,  var(--glow-1), transparent 60%),
        radial-gradient(900px  520px at 102% -4%, var(--glow-2), transparent 55%);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;

    min-height: 100vh;
    min-height: 100dvh;
    padding: clamp(12px, 2.4vw, 28px);
    display: flex;
    justify-content: center;
    align-items: flex-start;
}

.app{
    width: 100%;
    max-width: 1120px;
    display: flex;
    flex-direction: column;
    gap: clamp(14px, 2vw, 22px);
}

/* ============================================================
   Header
   ============================================================ */
.app-header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
}

.brand{
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
}

.brand-icon{
    flex: 0 0 auto;
    width: 44px;
    height: 44px;
    border-radius: 14px;
    display: grid;
    place-items: center;
    font-size: 24px;
    line-height: 1;
    color: #fff;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    box-shadow: 0 12px 24px -12px rgba(37, 99, 235, .95);
}

#app-name{
    font-size: clamp(1.05rem, 2.4vw, 1.4rem);
    font-weight: 700;
    letter-spacing: -.02em;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.lang-select{
    appearance: none;
    -webkit-appearance: none;
    padding: 10px 38px 10px 14px;
    font-family: inherit;
    font-size: .9rem;
    font-weight: 500;
    color: var(--text);
    background-color: var(--surface);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23808a9c' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat: no-repeat;
    background-position: right 12px center;
    background-size: 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(16,24,40,.04);
    transition: border-color .15s ease, box-shadow .15s ease, background-color .15s ease;
    max-width: 100%;
}
.lang-select:hover{ border-color: var(--border-strong); }
.lang-select:focus{
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
}

/* ============================================================
   Layout
   ============================================================ */
.main-container{
    display: grid;
    grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
    gap: clamp(16px, 2vw, 24px);
    align-items: start;
}

.card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    padding: clamp(16px, 2.2vw, 26px);
}

.board-section{
    display: flex;
    flex-direction: column;
    gap: clamp(14px, 2vw, 20px);
}

.info-section{
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.section-title{
    font-size: clamp(1rem, 1.7vw, 1.15rem);
    font-weight: 650;
    letter-spacing: -.01em;
    color: var(--text);
    margin: 0;
}

.hint{
    margin: 0;
    font-size: .875rem;
    line-height: 1.55;
    color: var(--muted);
}

/* ============================================================
   Board
   ============================================================ */
.board-wrapper{
    position: relative;
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
}

#board{
    display: flex;
    justify-content: center;
    width: 100%;
}

.board-b72b1{
    border: none !important;
    flex: 0 0 auto;
    box-shadow: 0 20px 42px -24px rgba(16,24,40,.85), 0 0 0 1px rgba(16,24,40,.06);
}

/* Overlay is positioned in JS to match the real board box exactly */
.board-overlay{
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
}

#capture-highlights-container{ position: absolute; inset: 0; }

#arrows-svg{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
}

.capture-highlight{
    position: absolute;
    width: 12.5%;
    height: 12.5%;
    border-radius: 8px;
    box-shadow:
        inset 0 0 0 4px rgba(220, 53, 69, .85),
        0 0 16px rgba(220, 53, 69, .45);
    animation: capPulse 1.1s ease-in-out infinite alternate;
}

@keyframes capPulse{
    from{ opacity: .75; }
    to  { opacity: 1;   }
}

/* ============================================================
   Buttons
   ============================================================ */
.btn-group{
    display: flex;
    gap: 12px;
}

.btn{
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 18px;
    font-family: inherit;
    font-size: .95rem;
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
    border: 1px solid transparent;
    border-radius: 12px;
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease,
                background-color .15s ease, border-color .15s ease, color .15s ease;
}

.btn svg{ flex: 0 0 auto; }

.btn:hover{
    transform: translateY(-2px);
    box-shadow: var(--shadow-pop);
}
.btn:active{
    transform: translateY(0) scale(.985);
    box-shadow: none;
}
.btn:focus-visible,
.lang-select:focus-visible,
textarea:focus-visible,
.move-badge:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 2px;
}

.btn-undo{
    background: var(--warn-soft);
    color: var(--warn-fg);
    border-color: transparent;
}

.btn-reset{
    background: var(--success-soft);
    color: var(--success-fg);
    border-color: transparent;
}

.btn-primary{
    background: linear-gradient(135deg, #2563eb, #4f46e5);
    color: #fff;
    box-shadow: 0 12px 24px -14px rgba(37, 99, 235, 1);
}
.btn-primary:hover{
    box-shadow: 0 18px 30px -16px rgba(37, 99, 235, 1);
}

/* ============================================================
   Turn indicator
   ============================================================ */
.turn-indicator{
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 14px 16px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    border-radius: 12px;
    font-size: .92rem;
    line-height: 1.5;
}

.turn-line{
    display: flex;
    align-items: center;
    gap: 9px;
    font-weight: 500;
}

.turn-dot{
    flex: 0 0 auto;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.18);
}
.dot-white{ background: #ffffff; box-shadow: inset 0 0 0 1px #c8ced8; }
.dot-black{ background: #2b2f38; box-shadow: inset 0 0 0 1px #0f1116; }

.turn-sub{
    font-size: .85rem;
    color: var(--muted);
}

/* ============================================================
   Move list
   ============================================================ */
.move-list{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
    gap: 8px;
    align-content: start;
    max-height: min(38vh, 290px);
    overflow-y: auto;
    padding-right: 4px;
    scrollbar-width: thin;
    scrollbar-color: var(--border-strong) transparent;
}

.move-list::-webkit-scrollbar{ width: 8px; }
.move-list::-webkit-scrollbar-track{ background: transparent; }
.move-list::-webkit-scrollbar-thumb{
    background: var(--border-strong);
    border-radius: 99px;
    border: 2px solid transparent;
    background-clip: content-box;
}
.move-list::-webkit-scrollbar-thumb:hover{ background-color: var(--muted); background-clip: content-box; }

.move-badge{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 9px 8px;
    font-size: .88rem;
    font-weight: 600;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    transition: transform .15s ease, box-shadow .15s ease,
                background-color .15s ease, border-color .15s ease;
}

.move-badge:hover{
    background: var(--surface);
    border-color: var(--border-strong);
    transform: translateY(-2px);
    box-shadow: var(--shadow-pop);
}

.status-badge{
    grid-column: 1 / -1;
    padding: 14px 12px;
    font-size: .95rem;
    cursor: default;
}
.status-danger{
    background: var(--danger-soft);
    color: var(--danger-fg);
    border-color: transparent;
}
.status-muted{
    background: var(--surface-3);
    color: var(--muted);
    border-color: transparent;
}
.status-badge:hover{ transform: none; box-shadow: none; }

/* ============================================================
   PGN panel
   ============================================================ */
.pgn-container{
    margin-top: 4px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.pgn-container h4{
    font-size: .95rem;
    font-weight: 650;
    margin: 0;
    color: var(--text);
}

textarea{
    width: 100%;
    min-height: 92px;
    padding: 12px 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .82rem;
    line-height: 1.55;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    resize: vertical;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease, background-color .15s ease;
}
textarea::placeholder{ color: var(--muted); opacity: .85; }
textarea:hover{ border-color: var(--border-strong); }
textarea:focus{
    background: var(--surface);
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
}

.pgn-status{
    display: none;
    padding: 9px 12px;
    font-size: .82rem;
    font-weight: 500;
    border-radius: var(--radius-sm);
}
.pgn-status.show{ display: block; }
.pgn-status.error{ background: var(--danger-soft); color: var(--danger-fg); }
.pgn-status.ok   { background: var(--success-soft); color: var(--success-fg); }

/* ============================================================
   Responsive
   ============================================================ */
@media (max-width: 920px){
    .main-container{
        grid-template-columns: 1fr;
    }
    .board-wrapper{
        max-width: min(520px, 100%);
    }
    .move-list{
        max-height: min(34vh, 260px);
    }
}

@media (max-width: 560px){
    .app-header{
        gap: 10px;
    }
    .lang-select{
        flex: 1 1 auto;
        min-width: 0;
    }
    .brand-icon{
        width: 38px;
        height: 38px;
        border-radius: 12px;
        font-size: 20px;
    }
    .btn{
        padding: 11px 12px;
        font-size: .88rem;
    }
    .move-list{
        grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
    }
    .move-badge{
        font-size: .82rem;
        padding: 8px 6px;
    }
}

@media (prefers-reduced-motion: reduce){
    *{
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>
<body>

<div class="app">

    <!-- ================= Header ================= -->
    <header class="app-header">
        <div class="brand">
            <div class="brand-icon" aria-hidden="true">&#9822;</div>
            <h1 id="app-name">Chess Analyzer</h1>
        </div>

        <select id="languageSelect" class="lang-select" aria-label="Language">
            <option value="en" selected>English</option>
            <option value="bn">বাংলা (Bengali)</option>
            <option value="es">Español (Spanish)</option>
            <option value="fr">Français (French)</option>
            <option value="hi">हिन्दी (Hindi)</option>
        </select>
    </header>

    <!-- ================= Main ================= -->
    <main class="main-container">

        <!-- Board -->
        <section class="card board-section">
            <h2 class="section-title" id="title-board">Chess Board</h2>

            <div class="board-wrapper">
                <div id="board"></div>

                <div class="board-overlay" id="boardOverlay">
                    <div id="capture-highlights-container"></div>
                    <svg id="arrows-svg" xmlns="http://www.w3.org/2000/svg"></svg>
                </div>
            </div>

            <div class="btn-group">
                <button id="undoBtn" class="btn btn-undo" type="button">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3l-3 2.7"/></svg>
                    <span id="btn-undo">Undo</span>
                </button>

                <button id="resetBtn" class="btn btn-reset" type="button">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
                    <span id="btn-reset">New Game</span>
                </button>
            </div>
        </section>

        <!-- Info panel -->
        <aside class="card info-section">
            <h3 class="section-title" id="title-moves">Possible Moves</h3>
            <p class="hint" id="desc-moves">Hover over any piece on the board or any move from the list below to see the action on the board.</p>

            <div id="turn-info" class="turn-indicator"></div>
            <div id="possible-moves" class="move-list"></div>

            <!-- PGN -->
            <div class="pgn-container">
                <h4 id="title-pgn">Load PGN</h4>
                <textarea id="pgnInput" rows="4" placeholder="Paste PGN text here..." spellcheck="false"></textarea>
                <div id="pgnStatus" class="pgn-status" role="status" aria-live="polite"></div>

                <button id="loadPgnBtn" class="btn btn-primary" type="button">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    <span id="btn-load-pgn">Load Game</span>
                </button>
            </div>
        </aside>

    </main>
</div>

    },
    hi: {
        appName: "शतरंज विश्लेषक",
        titleBoard: "शतरंज बिसात", btnUndo: "वापस लें (Undo)", btnReset: "नया खेल",
        titleMoves: "संभावित चालें", descMoves: "बोर्ड पर किसी भी मोहरे या नीचे दी गई सूची की किसी भी चाल पर माउस रखकर उसे देखें।",
        turnNow: "अब", turnSuffix: "की बारी है।", validMoves: "कुल वैध चालें:",
        white: "सफेद", black: "काला", checkmate: "शहमात (Checkmate)!", wins: "जीत गया।", draw: "खेल ड्रा (Draw)!",
        titlePgn: "PGN लोड करें", pgnPlaceholder: "यहाँ PGN टेक्स्ट पेस्ट करें...", btnLoadPgn: "गेम लोड करें",
        pgnError: "अमान्य PGN प्रारूप। कृपया टेक्स्ट जांचें और पुनः प्रयास करें।",
        pgnLoaded: "गेम सफलतापूर्वक लोड हो गया।"
    }
};

let currentLang = 'en';

/* ============================================================
   DOM refs
   ============================================================ */
var possibleMovesContainer = document.getElementById('possible-moves');
var turnInfo               = document.getElementById('turn-info');
var arrowsSvg              = document.getElementById('arrows-svg');
var captureContainer       = document.getElementById('capture-highlights-container');
var boardOverlay           = document.getElementById('boardOverlay');
var pgnStatusEl            = document.getElementById('pgnStatus');

/* ============================================================
   i18n
   ============================================================ */
function applyTranslation() {
    const lang = translations[currentLang];

    document.getElementById('app-name').innerText     = lang.appName;
    document.getElementById('title-board').innerText  = lang.titleBoard;
    document.getElementById('btn-undo').innerText     = lang.btnUndo;
    document.getElementById('btn-reset').innerText    = lang.btnReset;
    document.getElementById('title-moves').innerText  = lang.titleMoves;
    document.getElementById('desc-moves').innerText   = lang.descMoves;
    document.getElementById('title-pgn').innerText    = lang.titlePgn;
    document.getElementById('pgnInput').placeholder   = lang.pgnPlaceholder;
    document.getElementById('btn-load-pgn').innerText = lang.btnLoadPgn;

    document.title = lang.appName;
    updatePossibleMovesList();
}

document.getElementById('languageSelect').addEventListener('change', function (e) {
    currentLang = e.target.value;
    applyTranslation();
});

/* ============================================================
   Chess state
   ============================================================ */
var board = null;
var game  = new Chess();

var pieceColors = {
    'p': 'rgba(40, 167, 69, 0.4)',
    'n': 'rgba(13, 110, 253, 0.4)',
    'b': 'rgba(111, 66, 193, 0.4)',
    'r': 'rgba(253, 126, 20, 0.4)',
    'q': 'rgba(232, 62, 140, 0.4)',
    'k': 'rgba(217, 164, 6, 0.5)'
};

/* ============================================================
   Overlay alignment
   Keeps the SVG + capture layer perfectly on top of the board,
   no matter how chessboard.js sizes itself.
   ============================================================ */
function syncOverlay() {
    var $boardEl = $('.board-b72b1');
    if (!$boardEl.length) return;

    var w = $boardEl.outerWidth();
    var h = $boardEl.outerHeight();
    if (!w || !h) return;

    var pos = $boardEl.position(); // relative to .board-wrapper (position: relative)

    boardOverlay.style.left   = pos.left + 'px';
    boardOverlay.style.top    = pos.top + 'px';
    boardOverlay.style.width  = w + 'px';
    boardOverlay.style.height = h + 'px';
}

/* ============================================================
   Drawing helpers
   ============================================================ */
function getSquareCenter(sq, orientation) {
    var file = sq.charCodeAt(0) - 97;
    var rank = 8 - parseInt(sq[1]);
    if (orientation === 'black') { file = 7 - file; rank = 7 - rank; }
    return {
        x: (file * 12.5) + 6.25,
        y: (rank * 12.5) + 6.25,
        leftPercent: file * 12.5,
        topPercent: rank * 12.5
    };
}

function drawCaptures(movesVerbose) {
    captureContainer.innerHTML = '';
    var orientation = board.orientation();

    movesVerbose.forEach(function (move) {
        if (move.flags.indexOf('c') !== -1 || move.flags.indexOf('e') !== -1) {
            var coord = getSquareCenter(move.to, orientation);
            var highlight = document.createElement('div');
            highlight.className = 'capture-highlight';
            highlight.style.left = coord.leftPercent + '%';
            highlight.style.top  = coord.topPercent + '%';
            captureContainer.appendChild(highlight);
        }
    });
}

function drawArrows(movesVerbose) {
    arrowsSvg.innerHTML = '';

    var defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');

    Object.keys(pieceColors).forEach(function (piece) {
        var marker = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
        marker.setAttribute('id', 'arrowhead-' + piece);
        marker.setAttribute('markerWidth', '6');
        marker.setAttribute('markerHeight', '5');
        marker.setAttribute('refX', '5');
        marker.setAttribute('refY', '2.5');
        marker.setAttribute('orient', 'auto');

        var polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        polygon.setAttribute('points', '0 0, 6 2.5, 0 5');
        polygon.setAttribute('fill', pieceColors[piece]);

        marker.appendChild(polygon);
        defs.appendChild(marker);
    });

    arrowsSvg.appendChild(defs);

    var orientation = board.orientation();

    movesVerbose.forEach(function (move) {
        var fromCoord = getSquareCenter(move.from, orientation);
        var toCoord   = getSquareCenter(move.to, orientation);
        var color     = pieceColors[move.piece];

        var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', fromCoord.x + '%');
        line.setAttribute('y1', fromCoord.y + '%');
        line.setAttribute('x2', toCoord.x + '%');
        line.setAttribute('y2', toCoord.y + '%');
        line.setAttribute('stroke', color);
        line.setAttribute('stroke-width', '4');
        line.setAttribute('stroke-linecap', 'round');
        line.setAttribute('marker-end', 'url(#arrowhead-' + move.piece + ')');

        arrowsSvg.appendChild(line);
    });
}

function clearOverlays() {
    arrowsSvg.innerHTML = '';
    captureContainer.innerHTML = '';
}

/* ============================================================
   Move list
   ============================================================ */
function updatePossibleMovesList() {
    clearOverlays();

    var movesVerbose = game.moves({ verbose: true });
    var movesText    = game.moves();
    const lang       = translations[currentLang];

    possibleMovesContainer.innerHTML = '';

    var isWhite = game.turn() === 'w';
    var turnText = isWhite ? lang.white : lang.black;

    turnInfo.innerHTML =
        '<div class="turn-line">' +
            '<span class="turn-dot ' + (isWhite ? 'dot-white' : 'dot-black') + '"></span>' +
            '<span>' + lang.turnNow + ' <strong>' + turnText + '</strong> ' + lang.turnSuffix + '</span>' +
        '</div>' +
        '<div class="turn-sub">' + lang.validMoves + ' <strong>' + movesText.length + '</strong></div>';

    if (movesText.length === 0) {
        if (game.in_checkmate()) {
            var winnerText = isWhite ? lang.black : lang.white;
            possibleMovesContainer.innerHTML =
                '<span class="move-badge status-badge status-danger">' +
                    lang.checkmate + ' ' + winnerText + ' ' + lang.wins +
                '</span>';
        } else {
            possibleMovesContainer.innerHTML =
                '<span class="move-badge status-badge status-muted">' + lang.draw + '</span>';
        }
        return;
    }

    movesVerbose.forEach(function (moveVerbose) {
        var span = document.createElement('span');
        span.className = 'move-badge';

        var isCapture = (moveVerbose.flags.indexOf('c') !== -1 || moveVerbose.flags.indexOf('e') !== -1);
        span.style.borderLeft =
            '4px solid ' + pieceColors[moveVerbose.piece].replace('0.4', '1').replace('0.5', '1');
        span.innerHTML = moveVerbose.san + (isCapture ? ' ⚔️' : '');

        span.addEventListener('mouseenter', function () {
            drawArrows([moveVerbose]);
            drawCaptures([moveVerbose]);
        });
        span.addEventListener('mouseleave', clearOverlays);

        possibleMovesContainer.appendChild(span);
    });
}

/* ============================================================
   Board callbacks
   ============================================================ */
function onMouseoverSquare(square, piece) {
    if (game.game_over() || piece === false) return;
    if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
        (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
        return;
    }
    var movesVerbose = game.moves({ square: square, verbose: true });
    if (movesVerbose.length === 0) return;
    drawArrows(movesVerbose);
    drawCaptures(movesVerbose);
}

function onMouseoutSquare() {
    clearOverlays();
}

function onDragStart(source, piece) {
    if (game.game_over() ||
        (game.turn() === 'w' && piece.search(/^b/) !== -1) ||
        (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
        return false;
    }
    clearOverlays();
}

function onDrop(source, target) {
    var move = game.move({ from: source, to: target, promotion: 'q' });
    if (move === null) return 'snapback';
    updatePossibleMovesList();
}

function onSnapEnd() {
    board.position(game.fen());
}

/* ============================================================
   Init board
   ============================================================ */
var config = {
    draggable: true,
    position: 'start',
    onDragStart: onDragStart,
    onDrop: onDrop,
    onSnapEnd: onSnapEnd,
    onMouseoverSquare: onMouseoverSquare,
    onMouseoutSquare: onMouseoutSquare,
    pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
};

board = Chessboard('board', config);
applyTranslation();

/* Align overlay once layout settles */
requestAnimationFrame(function () {
    syncOverlay();
    setTimeout(syncOverlay, 220);
});

/* ============================================================
   Responsive handling
   ============================================================ */
var resizeTimer = null;

function relayout() {
    if (board) board.resize();
    syncOverlay();
    clearOverlays();
}

window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(relayout, 120);
});

window.addEventListener('orientationchange', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(relayout, 260);
});

/* ============================================================
   PGN helpers
   ============================================================ */
var statusTimer = null;

function showPgnStatus(message, type) {
    pgnStatusEl.innerText = message;
    pgnStatusEl.className = 'pgn-status show ' + type;
    clearTimeout(statusTimer);
    statusTimer = setTimeout(function () {
        pgnStatusEl.className = 'pgn-status';
    }, 3500);
}

$('#loadPgnBtn').on('click', function () {
    var pgn = $('#pgnInput').val();

    if (game.load_pgn(pgn)) {
        board.position(game.fen());
        updatePossibleMovesList();
        clearOverlays();
        showPgnStatus(translations[currentLang].pgnLoaded, 'ok');
    } else {
        showPgnStatus(translations[currentLang].pgnError, 'error');
    }
});

/* ============================================================
   Controls
   ============================================================ */
$('#undoBtn').on('click', function () {
    game.undo();
    board.position(game.fen());
    updatePossibleMovesList();
    clearOverlays();
});

$('#resetBtn').on('click', function () {
    game.reset();
    board.start();
    updatePossibleMovesList();
    $('#pgnInput').val('');
    pgnStatusEl.className = 'pgn-status';
    clearOverlays();
});
</script>

</body>
</html>
